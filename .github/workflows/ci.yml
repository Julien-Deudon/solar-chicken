name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:  # pour les tests propres à Postgres (TEST_POSTGRES_DSN)
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt -w on the files above"; exit 1; }
      - run: go vet ./... && go test ./...
        env:
          GOFLAGS: -buildvcs=false
          TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=test dbname=postgres sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit && npx next lint
      - run: npm run build
        env: { API_INTERNAL_URL: "http://api:8080" }
